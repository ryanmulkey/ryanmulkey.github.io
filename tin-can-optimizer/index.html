<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tin Can Optimizer</title>
<style>
:root{
  --bg:#0b1220;--panel:#111a2b;--panel2:#0f1727;--ink:#eef4ff;--muted:#8fa0ba;
  --line:#22304a;--blue:#5aa7ff;--cyan:#61d6d1;--purple:#9a7cff;--green:#42c98a;
  --amber:#f0b44d;--red:#f06a6a;--shadow:0 24px 60px rgba(0,0,0,.34)
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:
radial-gradient(circle at 14% 8%,rgba(90,167,255,.16),transparent 30rem),
radial-gradient(circle at 86% 12%,rgba(154,124,255,.12),transparent 26rem),
linear-gradient(180deg,#0a101c,#0b1220 44%,#0a111d)}
main{width:min(1180px,calc(100% - 32px));margin:auto;padding:42px 0 54px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:clamp(2.25rem,5vw,3.7rem);font-weight:800;letter-spacing:-.055em}
.brandmark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 12px 30px rgba(90,167,255,.22);position:relative}
.brandmark:after{content:"";position:absolute;inset:11px;border:2px solid rgba(255,255,255,.88);border-radius:50%}
.layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:22px;align-items:stretch}
.card{background:linear-gradient(180deg,rgba(17,26,43,.95),rgba(15,23,39,.98));border:1px solid rgba(98,118,151,.22);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)}
.controls{padding:26px;display:flex;flex-direction:column;min-height:660px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
h2{margin:0;font-size:1.03rem;letter-spacing:-.01em}
.weight-pill{padding:7px 10px;border-radius:999px;background:rgba(97,214,209,.10);border:1px solid rgba(97,214,209,.20);color:#9ef1ec;font-size:.75rem;font-weight:700;white-space:nowrap}
.ideal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.ideal-box{padding:13px 14px;border-radius:15px;background:#0c1525;border:1px solid var(--line)}
.ideal-label{display:block;color:var(--muted);font-size:.73rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ideal-value{font-size:1.08rem;font-weight:750}
.field{margin-top:15px}
label{display:block;margin:0 0 7px;color:#c9d6e8;font-size:.83rem;font-weight:700}
.input-wrap{position:relative}
input{width:100%;padding:13px 48px 13px 14px;border-radius:14px;border:1px solid #2a3a58;background:#0a1322;color:var(--ink);font:inherit;font-size:1rem;outline:none;transition:.18s ease}
input:hover{border-color:#395074}
input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(90,167,255,.12)}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.82rem}
.error{display:none;margin-top:10px;color:#ff9696;font-size:.82rem}
.score-card{margin-top:28px;padding:22px;border-radius:20px;background:linear-gradient(135deg,rgba(90,167,255,.12),rgba(154,124,255,.10));border:1px solid rgba(104,132,181,.24)}
.score-label{color:#b8c7dc;font-size:.73rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
.score-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:5px}
.score{font-size:3.25rem;line-height:.95;font-weight:820;letter-spacing:-.06em}
.score-ring{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#7ed7ff,#5a8dff 58%,#735bda);box-shadow:0 8px 28px rgba(90,167,255,.24)}
.stats{display:grid;gap:10px;margin-top:14px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border-radius:14px;background:#0c1525;border:1px solid var(--line)}
.stat span{color:var(--muted);font-size:.84rem}.stat strong{font-variant-numeric:tabular-nums}
.chart-card{padding:24px;min-height:660px;display:flex;flex-direction:column}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 12px;color:var(--muted);font-size:.74rem}
.key{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%}
.plot{width:100%;aspect-ratio:1/1;max-height:590px;margin:auto 0 0}
.axis-label{fill:#96a6bc;font-size:13px;font-weight:600}
@media(max-width:860px){main{padding-top:26px}.topbar{margin-bottom:18px}.layout{grid-template-columns:1fr}.controls{min-height:auto}.chart-card{min-height:560px}.chart-head{align-items:flex-start;flex-direction:column}.legend{justify-content:flex-start}}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>Tin Can Optimizer</h1>
    <div class="brandmark" aria-hidden="true"></div>
  </div>

  <div class="layout">
    <section class="card controls">
      <div class="section-head">
        <h2>Measurements</h2>
        <span class="weight-pill">Circumference ×1.5</span>
      </div>

      <div class="ideal-grid">
        <div class="ideal-box"><span class="ideal-label">Ideal height</span><span class="ideal-value">6.00 in</span></div>
        <div class="ideal-box"><span class="ideal-label">Ideal circumference</span><span class="ideal-value">5.20 in</span></div>
      </div>

      <div class="field">
        <label for="h">Height</label>
        <div class="input-wrap"><input id="h" type="number" min=".001" step=".01" value="6.00"><span class="unit">in</span></div>
      </div>

      <div class="field">
        <label for="c">Circumference</label>
        <div class="input-wrap"><input id="c" type="number" min=".001" step=".01" value="5.20"><span class="unit">in</span></div>
      </div>

      <div id="err" class="error">Enter positive values for both measurements.</div>

      <div class="score-card">
        <div class="score-label">Justin Unit</div>
        <div class="score-row"><div id="score" class="score">1.0000</div><div class="score-ring" aria-hidden="true"></div></div>
      </div>

      <div class="stats">
        <div class="stat"><span>Height deviation</span><strong id="hd">+0.00%</strong></div>
        <div class="stat"><span>Circumference deviation</span><strong id="cd">+0.00%</strong></div>
      </div>
    </section>

    <section class="card chart-card">
      <div class="chart-head">
        <h2>Weighted Dimension Map</h2>
        <div class="legend">
          <span class="key"><i class="dot" style="background:#5aa7ff"></i>Ideal</span>
          <span class="key"><i class="dot" style="background:#9a7cff"></i>Measured</span>
          <span class="key"><i class="dot" style="background:#42c98a"></i>5%</span>
          <span class="key"><i class="dot" style="background:#f0b44d"></i>10%</span>
          <span class="key"><i class="dot" style="background:#f06a6a"></i>20%</span>
        </div>
      </div>

      <svg id="plot" class="plot" viewBox="0 0 620 620" role="img" aria-label="Weighted dimension graph">
        <defs>
          <linearGradient id="plotBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1627"/><stop offset="1" stop-color="#0a1322"/></linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect x="70" y="30" width="510" height="510" rx="18" fill="url(#plotBg)" stroke="#263754"/>
        <g id="grid"></g><g id="rings"></g><g id="ticks"></g>
        <line id="vx" x1="325" y1="30" x2="325" y2="540" stroke="#40516d" stroke-dasharray="3 6"/>
        <line id="hy" x1="70" y1="285" x2="580" y2="285" stroke="#40516d" stroke-dasharray="3 6"/>
        <text x="325" y="594" text-anchor="middle" class="axis-label">Weighted normalized circumference</text>
        <text x="20" y="285" text-anchor="middle" class="axis-label" transform="rotate(-90 20 285)">Normalized height</text>
        <polygon id="ideal" fill="#5aa7ff" stroke="#dbeeff" stroke-width="1.5" filter="url(#glow)"/>
        <circle id="measured" r="8" fill="#9a7cff" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
      </svg>
    </section>
  </div>
</main>
<script>
const H0=6,C0=5.2,W=1.5,$=id=>document.getElementById(id),svgNS="http://www.w3.org/2000/svg";
function metrics(h,c){const hn=h/H0,cn=c/C0,he=hn-1,ce=cn-1,we=W*ce,e=Math.hypot(he,we);return{hn,he,ce,we,x:1+we,g:1/(1+e)}}
function pct(v){const n=v*100;return(n>=0?"+":"")+n.toFixed(2)+"%"}
function S(tag,a){const e=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function star(cx,cy){let pts=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?5:11;pts.push(`${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`)}return pts.join(" ")}
function draw(m){
  const dx=Math.abs(m.x-1),dy=Math.abs(m.hn-1),span=Math.max(.24,dx*1.3,dy*1.3),min=1-span,max=1+span;
  const X=v=>70+(v-min)/(max-min)*510,Y=v=>540-(v-min)/(max-min)*510,U=v=>v/(max-min)*510;
  const grid=$("grid"),rings=$("rings"),ticks=$("ticks");grid.innerHTML=rings.innerHTML=ticks.innerHTML="";
  for(let i=0;i<=8;i++){const p=70+i*63.75,q=30+i*63.75;grid.append(S("line",{x1:p,y1:30,x2:p,y2:540,stroke:"#18263b","stroke-width":"1"}),S("line",{x1:70,y1:q,x2:580,y2:q,stroke:"#18263b","stroke-width":"1"}))}
  [[.2,"#f06a6a"],[.1,"#f0b44d"],[.05,"#42c98a"]].forEach(([r,color])=>rings.append(S("circle",{cx:X(1),cy:Y(1),r:U(r),fill:color,"fill-opacity":".045",stroke:color,"stroke-opacity":".86","stroke-width":"1.6","stroke-dasharray":"7 6"})));
  for(let i=0;i<=4;i++){
    let v=min+i*(max-min)/4,t=S("text",{x:70+i*127.5,y:562,"text-anchor":"middle",fill:"#8191aa","font-size":"12"});t.textContent=v.toFixed(2);ticks.append(t);
    v=max-i*(max-min)/4;t=S("text",{x:57,y:34+i*127.5,"text-anchor":"end",fill:"#8191aa","font-size":"12"});t.textContent=v.toFixed(2);ticks.append(t)
  }
  $("vx").setAttribute("x1",X(1));$("vx").setAttribute("x2",X(1));$("hy").setAttribute("y1",Y(1));$("hy").setAttribute("y2",Y(1));
  $("ideal").setAttribute("points",star(X(1),Y(1)));$("measured").setAttribute("cx",X(m.x));$("measured").setAttribute("cy",Y(m.hn));
}
function update(){
  const h=+$("h").value,c=+$("c").value;
  if(!(h>0&&c>0)){ $("err").style.display="block";return }
  $("err").style.display="none";
  const m=metrics(h,c);$("score").textContent=m.g.toFixed(4);$("hd").textContent=pct(m.he);$("cd").textContent=pct(m.ce);draw(m)
}
$("h").addEventListener("input",update);$("c").addEventListener("input",update);update();
</script>
</body>
</html>
