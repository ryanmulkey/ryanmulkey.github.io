<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tin Can Optimizer</title>
<style>
:root{
  --paper:#ece5d6;
  --paper-2:#e4dac6;
  --panel:#f4eedf;
  --ink:#20272b;
  --muted:#6a6b63;
  --line:#2f3a3e;
  --soft-line:#b9ad96;
  --orange:#d56832;
  --teal:#2d7f7a;
  --green:#4c8b5f;
  --amber:#c58a2e;
  --red:#b94a3e;
  --shadow:6px 6px 0 rgba(32,39,43,.14);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  color:var(--ink);
  font:15px "Courier New",Courier,monospace;
  background:
    linear-gradient(rgba(32,39,43,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(32,39,43,.035) 1px,transparent 1px),
    var(--paper);
  background-size:28px 28px;
}
main{width:min(1140px,calc(100% - 32px));margin:auto;padding:40px 0 54px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;border-bottom:3px solid var(--ink);padding-bottom:14px}
h1{margin:0;font-size:clamp(2rem,5vw,3.4rem);font-weight:900;letter-spacing:-.07em;text-transform:uppercase}
.brandmark{width:52px;height:34px;border:3px solid var(--ink);position:relative;background:var(--orange);box-shadow:4px 4px 0 var(--ink)}
.brandmark:before,.brandmark:after{content:"";position:absolute;background:var(--ink)}
.brandmark:before{width:20px;height:3px;left:13px;top:8px}.brandmark:after{width:20px;height:3px;left:13px;top:18px}
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:stretch}
.card{background:var(--panel);border:3px solid var(--ink);box-shadow:var(--shadow)}
.controls{padding:24px;display:flex;flex-direction:column;min-height:640px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;border-bottom:1px solid var(--soft-line);padding-bottom:10px}
h2{margin:0;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.field{margin-top:18px}
label{display:block;margin:0 0 7px;color:var(--ink);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.input-wrap{position:relative}
input{width:100%;padding:13px 48px 13px 14px;border:2px solid var(--ink);background:#fffaf0;color:var(--ink);font:700 1rem "Courier New",Courier,monospace;outline:none;border-radius:0;box-shadow:3px 3px 0 rgba(32,39,43,.13)}
input:focus{outline:3px solid var(--teal);outline-offset:2px}
.unit{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;font-weight:700}
.reset-btn{margin-top:20px;width:100%;padding:12px 14px;border:2px solid var(--ink);background:var(--orange);color:#fffaf0;font:800 .88rem "Courier New",Courier,monospace;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.reset-btn:hover{transform:translate(1px,1px);box-shadow:3px 3px 0 var(--ink)}
.reset-btn:active{transform:translate(4px,4px);box-shadow:none}
.error{display:none;margin-top:10px;color:var(--red);font-size:.82rem;font-weight:700}
.score-card{margin-top:26px;padding:20px;border:2px solid var(--ink);background:var(--paper-2);position:relative}
.score-card:before{content:"";position:absolute;left:0;top:0;width:8px;height:100%;background:var(--teal)}
.score-label{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;font-weight:800;padding-left:6px}
.score{margin-top:7px;padding-left:6px;font-size:3.05rem;line-height:.95;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.stats{display:grid;gap:10px;margin-top:14px}
.stat{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--soft-line);background:#ebe1ce}
.stat span{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}.stat strong{font-variant-numeric:tabular-nums;color:var(--ink)}
.chart-card{padding:24px;min-height:640px;display:flex;flex-direction:column}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:10px;border-bottom:1px solid var(--soft-line);padding-bottom:10px}
.legend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 14px;color:var(--muted);font-size:.72rem;text-transform:uppercase}
.key{display:inline-flex;align-items:center;gap:6px}.dot{width:10px;height:10px;border:1px solid var(--ink)}
.plot{width:100%;aspect-ratio:1/1;max-height:580px;margin:auto 0 0}
.axis-label{fill:#555b59;font-size:13px;font-weight:700;text-transform:uppercase}
@media(max-width:860px){main{padding-top:24px}.topbar{margin-bottom:18px}.layout{grid-template-columns:1fr}.controls{min-height:auto}.chart-card{min-height:540px}.chart-head{align-items:flex-start;flex-direction:column}.legend{justify-content:flex-start}}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <h1>Tin Can Optimizer</h1>
    <div class="brandmark" aria-hidden="true"></div>
  </div>

  <div class="layout">
    <section class="card controls">
      <div class="section-head"><h2>Measurements</h2></div>

      <div class="field">
        <label for="h">Height</label>
        <div class="input-wrap"><input id="h" type="number" min=".001" step=".01" value="6.00"><span class="unit">in</span></div>
      </div>

      <div class="field">
        <label for="g">Girth</label>
        <div class="input-wrap"><input id="g" type="number" min=".001" step=".01" value="5.20"><span class="unit">in</span></div>
      </div>

      <button id="reset" class="reset-btn" type="button">Reset</button>
      <div id="err" class="error">Enter positive values for both measurements.</div>

      <div class="score-card">
        <div class="score-label">Justin Unit</div>
        <div id="score" class="score">1.0000</div>
      </div>

      <div class="stats">
        <div class="stat"><span>Height deviation</span><strong id="hd">+0.00%</strong></div>
        <div class="stat"><span>Girth deviation</span><strong id="gd">+0.00%</strong></div>
      </div>
    </section>

    <section class="card chart-card">
      <div class="chart-head">
        <h2>Weighted Dimension Map</h2>
        <div class="legend">
          <span class="key"><i class="dot" style="background:#2d7f7a"></i>Measured</span>
          <span class="key"><i class="dot" style="background:#4c8b5f"></i>5%</span>
          <span class="key"><i class="dot" style="background:#c58a2e"></i>10%</span>
          <span class="key"><i class="dot" style="background:#b94a3e"></i>20%</span>
        </div>
      </div>

      <svg id="plot" class="plot" viewBox="0 0 620 620" role="img" aria-label="Weighted dimension graph">
        <rect x="70" y="30" width="510" height="510" fill="#f7f0df" stroke="#20272b" stroke-width="2"/>
        <g id="grid"></g><g id="rings"></g><g id="ticks"></g>
        <line id="vx" x1="325" y1="30" x2="325" y2="540" stroke="#6e746e" stroke-width="1" stroke-dasharray="4 5"/>
        <line id="hy" x1="70" y1="285" x2="580" y2="285" stroke="#6e746e" stroke-width="1" stroke-dasharray="4 5"/>
        <text x="325" y="594" text-anchor="middle" class="axis-label">Weighted normalized girth</text>
        <text x="20" y="285" text-anchor="middle" class="axis-label" transform="rotate(-90 20 285)">Normalized height</text>
        <circle id="measured" r="8" fill="#2d7f7a" stroke="#20272b" stroke-width="2"/>
      </svg>
    </section>
  </div>
</main>
<script>
const H0=6,G0=5.2,W=1.5,$=id=>document.getElementById(id),svgNS="http://www.w3.org/2000/svg";
function metrics(h,g){const hn=h/H0,gn=g/G0,he=hn-1,ge=gn-1,wge=W*ge,e=Math.hypot(he,wge);return{hn,he,ge,wge,x:1+wge,g:1/(1+e)}}
function pct(v){const n=v*100;return(n>=0?"+":"")+n.toFixed(2)+"%"}
function S(tag,a){const e=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e}
function draw(m){
  const dx=Math.abs(m.x-1),dy=Math.abs(m.hn-1),span=Math.max(.24,dx*1.3,dy*1.3),min=1-span,max=1+span;
  const X=v=>70+(v-min)/(max-min)*510,Y=v=>540-(v-min)/(max-min)*510,U=v=>v/(max-min)*510;
  const grid=$("grid"),rings=$("rings"),ticks=$("ticks");grid.innerHTML=rings.innerHTML=ticks.innerHTML="";
  for(let i=0;i<=8;i++){
    const p=70+i*63.75,q=30+i*63.75;
    grid.append(
      S("line",{x1:p,y1:30,x2:p,y2:540,stroke:"#d8ccb5","stroke-width":"1"}),
      S("line",{x1:70,y1:q,x2:580,y2:q,stroke:"#d8ccb5","stroke-width":"1"})
    )
  }
  [[.2,"#b94a3e"],[.1,"#c58a2e"],[.05,"#4c8b5f"]].forEach(([r,color])=>rings.append(S("circle",{cx:X(1),cy:Y(1),r:U(r),fill:"none",stroke:color,"stroke-width":"2","stroke-dasharray":"8 6"})));
  for(let i=0;i<=4;i++){
    let v=min+i*(max-min)/4,t=S("text",{x:70+i*127.5,y:562,"text-anchor":"middle",fill:"#66685f","font-size":"12","font-family":"Courier New, monospace","font-weight":"700"});t.textContent=v.toFixed(2);ticks.append(t);
    v=max-i*(max-min)/4;t=S("text",{x:57,y:34+i*127.5,"text-anchor":"end",fill:"#66685f","font-size":"12","font-family":"Courier New, monospace","font-weight":"700"});t.textContent=v.toFixed(2);ticks.append(t)
  }
  $("vx").setAttribute("x1",X(1));$("vx").setAttribute("x2",X(1));$("hy").setAttribute("y1",Y(1));$("hy").setAttribute("y2",Y(1));
  $("measured").setAttribute("cx",X(m.x));$("measured").setAttribute("cy",Y(m.hn));
}
function update(){
  const h=+$("h").value,g=+$("g").value;
  if(!(h>0&&g>0)){ $("err").style.display="block";return }
  $("err").style.display="none";
  const m=metrics(h,g);$("score").textContent=m.g.toFixed(4);$("hd").textContent=pct(m.he);$("gd").textContent=pct(m.ge);draw(m)
}
$("h").addEventListener("input",update);
$("g").addEventListener("input",update);
$("reset").addEventListener("click",()=>{$("h").value="6.00";$("g").value="5.20";update()});
update();
</script>
</body>
</html>
